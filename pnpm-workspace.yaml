allowBuilds:
  # Both ship prebuilt binaries or have a JS fallback; we skip their build
  # scripts to keep installs reproducible without native toolchains.
  '@parcel/watcher': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.0'
  - '@tanstack/react-query@5.105.0'
